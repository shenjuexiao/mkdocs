# .github/workflows/mkdocs-site-github-cn.yml
name: mkdocs-site-github-cn

on:
  push:
    branches:
      # 当 main 分支有推送时触发
      - main  
    paths:
      # 只有 docs 文件夹或配置文件变更时才触发
      - 'docs/**'  
      - 'mkdocs.yml'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        # 如果有其他插件，也一并安装
        run: pip install mkdocs mkdocs-material
        # 20260814
        # 如果需要其他插件，在这里添加
        # pip install mkdocs-minify-plugin mkdocs-git-revision-date-plugin  
        
      # 20260814
      # - name: Deploy to GitHub Pages
        # run: mkdocs gh-deploy --force
      
      # 20260814
      # ⚠️ 关键步骤：构建 MkDocs 站点
      - name: Build MkDocs site
        run: mkdocs build --verbose
      
      # 调试：查看构建产物
      - name: List build output
        run: |
          echo "Checking if site directory exists..."
          ls -la
          if [ -d "site" ]; then
            echo "✅ site directory exists"
            ls -la site/
          else
            echo "❌ site directory not found!"
            exit 1
          fi 
      
      # 部署到外部仓库
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          # GitHub 自动注入 GITHUB_TOKEN
          # github_token: ${{ secrets.GITHUB_TOKEN }}
          # 源仓库 Secrets 设置 PERSONAL_TOKEN
          personal_token: ${{ secrets.MKDOCS }} 
          # 部署仓库（用户名/仓库）
          external_repository: shenjuexiao/mkdocs-site
          # 部署分支（默认 gh-pages）
          publish_branch: gh-pages
          # 部署文件夹（构建产物目录 Astro / VitePress 默认输出 dist）
          publish_dir: ./site
          # 保留历史提交记录（可选）
          keep_files: false
          # 部署强制推送
          force_orphan: false
          # 提交信息（可选）
          commit_message: 'Deploy Mkdocs site - ${{ github.sha }}'
          # 允许外部用户提交（可选，公共仓库建议设为 true）
          allow_empty_commit: false
          # 自定义域名（可选，如果你的站点使用自定义域名）
          cname: mkdocs-site.shenjuexiao.com
          # 用户信息
          # user_name: "github-actions[bot]"
          # user_email: "github-actions[bot]@users.noreply.github.com"
          user_name: "shenjuexiao"
          user_email: "shenjuexiao@qq.com"
